name: 构建并发布闭源桌面客户端
run-name: 发布 Writer Agent ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 私有源码仓库中已存在的版本标签，例如 v0.1.5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-source-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: qian-lou/writer-agent
  DISTRIBUTION_REPOSITORY: qian-lou/writer-agent-downloads
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  preflight:
    name: 校验私有源码版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出生产发布工作流
        uses: actions/checkout@v4
        with:
          path: distribution

      - name: 检出指定私有源码标签
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: 校验版本与生产服务地址
        id: version
        shell: bash
        working-directory: source
        env:
          WRITER_AGENT_UPDATER_PUBLIC_KEY: ${{ vars.WRITER_AGENT_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本标签格式错误: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('app/src-tauri/tauri.conf.json', 'utf8')).version")"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' app/src-tauri/Cargo.toml | head -n 1)"
          cert_server_url="$(sed -nE 's/^const CERT_SERVER_URL: &str = "([^"]+)";/\1/p' app/src-tauri/src/writer_harness/certificate.rs)"

          if [[ "$version" != "$tauri_version" || "$version" != "$cargo_version" ]]; then
            echo "版本不一致: tag=$version tauri=$tauri_version cargo=$cargo_version" >&2
            exit 1
          fi
          if [[ "$cert_server_url" != "https://www.foodspace.cloud/writer-agent/api" ]]; then
            echo "发布版证书服务地址错误: $cert_server_url" >&2
            exit 1
          fi
          if [[ -z "${WRITER_AGENT_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "缺少在线更新签名公钥变量" >&2
            exit 1
          fi
          bash scripts/check-release-notes.sh "$RELEASE_TAG" RELEASE_NOTES.md
          bash scripts/check-release-signing-contract.sh \
            "$GITHUB_WORKSPACE/distribution/.github/workflows/release-private-source.yml" \
            "$GITHUB_WORKSPACE/source/app/src-tauri/tauri.conf.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS-Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 240
    steps:
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev build-essential \
            patchelf libfuse2 file

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 pnpm
        shell: bash
        run: npm install --global pnpm@10.32.1

      - name: 安装 Rust 目标
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: 安装 protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ github.token }}

      - name: 检出指定私有源码标签
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: 安装前端依赖
        working-directory: source/app
        run: pnpm install --frozen-lockfile

      - name: 导入并校验 macOS 自签名证书
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_SHA256: ${{ secrets.MACOS_CERTIFICATE_SHA256 }}
          MACOS_SIGNING_IDENTITY: Writer Agent Local Release
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_CERTIFICATE_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "缺少 macOS 发布 Secrets: ${missing[*]}" >&2
            exit 1
          fi
          expected_fingerprint="$(tr -d '[:space:]:' <<<"$MACOS_CERTIFICATE_SHA256" \
            | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected_fingerprint" =~ ^[A-F0-9]{64}$ ]]; then
            echo "MACOS_CERTIFICATE_SHA256 必须是 64 位 SHA-256 指纹" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/writer-agent-signing.p12"
          certificate_pem_path="$RUNNER_TEMP/writer-agent-signing.pem"
          keychain_path="$RUNNER_TEMP/writer-agent-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          trap 'rm -f "$certificate_path"' EXIT
          echo "WRITER_AGENT_SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "WRITER_AGENT_SIGNING_CERTIFICATE_PATH=$certificate_pem_path" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_CERTIFICATE" \
            | /usr/bin/openssl base64 -d -A -out "$certificate_path"
          /usr/bin/openssl pkcs12 -in "$certificate_path" -nokeys \
            -passin env:MACOS_CERTIFICATE_PASSWORD -out "$certificate_pem_path"
          actual_fingerprint="$(/usr/bin/openssl x509 -in "$certificate_pem_path" \
            -outform DER | /usr/bin/shasum -a 256 | awk '{print toupper($1)}')"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "macOS 签名证书指纹与 MACOS_CERTIFICATE_SHA256 不匹配" >&2
            exit 1
          fi

          /usr/bin/security create-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security set-keychain-settings -t 3600 -u "$keychain_path"
          /usr/bin/security import "$certificate_path" \
            -k "$keychain_path" -f pkcs12 -t agg \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          sudo /usr/bin/security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$certificate_pem_path"
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          /usr/bin/security list-keychains -d user -s "$keychain_path"
          /usr/bin/security default-keychain -d user -s "$keychain_path"
          if ! /usr/bin/security find-identity -v -p codesigning "$keychain_path" \
            | grep -Fq "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "导入的证书不是预期的 Writer Agent 代码签名身份" >&2
            exit 1
          fi

      - name: 构建安装包
        shell: bash
        working-directory: source/app
        env:
          WRITER_HARNESS_TARGET: ${{ matrix.target }}
          WRITER_AGENT_UPDATER_PUBLIC_KEY: ${{ vars.WRITER_AGENT_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${WRITER_AGENT_UPDATER_PUBLIC_KEY:-}" \
            || -z "${TAURI_SIGNING_PRIVATE_KEY:-}" \
            || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "::error::在线更新签名配置不完整。"
            exit 1
          fi
          updater_config="$(node -e '
            const pubkey = process.env.WRITER_AGENT_UPDATER_PUBLIC_KEY?.trim();
            if (!pubkey) process.exit(1);
            process.stdout.write(JSON.stringify({ plugins: { updater: { pubkey } } }));
          ')"
          set +e
          pnpm exec tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "$updater_config" \
            > "$RUNNER_TEMP/writer-agent-build.log" 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            classify_failure() {
              local label="$1"
              local pattern="$2"
              local count
              count="$(grep -Eic -- "$pattern" "$RUNNER_TEMP/writer-agent-build.log" || true)"
              echo "BUILD_FAILURE_$label=$count"
            }

            classify_failure BEFORE_BUILD_COMMAND 'beforeBuildCommand.*failed|before build command.*failed'
            classify_failure RUST_COMPILE 'error\[E[0-9]{4}\]|could not compile'
            classify_failure LINKER 'linking with .* failed|linker .* not found|link\.exe.*failed'
            classify_failure RUNTIME_BUNDLE 'bundle-writer-harness|writer-harness-runtime'
            classify_failure GATEWAY_BUNDLE 'bundle-gateway-sidecar|gateway-sidecar'
            classify_failure UPDATER_SIGNING 'failed to sign|signing.*failed|private key|incorrect password|invalid password'
            classify_failure UPDATER_CONFIG 'failed to decode pubkey|failed to convert updater pubkey|Missing comment in public key|no private key|signature creation'
            classify_failure TAURI_BUNDLER 'failed to bundle|bundle project'
            classify_failure APPIMAGE 'AppImage|appimagetool|linuxdeploy'
            classify_failure DEBIAN_PACKAGE 'dpkg|\.deb([^a-z]|$)|debian package'
            classify_failure WINDOWS_MSI 'light\.exe|candle\.exe|wix|\.msi([^a-z]|$)'
            classify_failure WINDOWS_NSIS 'makensis|nsis'
            classify_failure MISSING_FILE 'no such file or directory|cannot find the (path|file)|file not found'
            classify_failure PERMISSION 'permission denied|access is denied'
            classify_failure NETWORK 'failed to download|error sending request|dns error|timed out|connection reset'
            classify_failure NETWORK_RESOLUTION 'failed to lookup address information|temporary failure in name resolution|could not resolve host|name or service not known'
            classify_failure DISK 'no space left on device|disk full'
            classify_failure MEMORY 'out of memory|memory allocation.*failed'
            classify_failure PANIC 'panicked at|thread .* panicked'
            echo "::error::安装包构建失败；详细编译日志未公开，以避免泄露私有源码。"
            exit "$status"
          fi

      - name: 校验 macOS 稳定自签名
        if: runner.os == 'macOS'
        shell: bash
        working-directory: source
        env:
          MACOS_CERTIFICATE_SHA256: ${{ secrets.MACOS_CERTIFICATE_SHA256 }}
        run: >-
          bash scripts/check-macos-release-signing.sh
          "app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Writer Agent.app"
          "com.writer-agent.dev"
          "$MACOS_CERTIFICATE_SHA256"

      - name: 清理 macOS 临时钥匙串
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${WRITER_AGENT_SIGNING_CERTIFICATE_PATH:-}" \
            && -f "$WRITER_AGENT_SIGNING_CERTIFICATE_PATH" ]]; then
            sudo /usr/bin/perl -e 'alarm shift; exec @ARGV' 15 \
              /usr/bin/security remove-trusted-cert -d \
              "$WRITER_AGENT_SIGNING_CERTIFICATE_PATH" || true
            rm -f "$WRITER_AGENT_SIGNING_CERTIFICATE_PATH"
          fi
          if [[ -n "${WRITER_AGENT_SIGNING_KEYCHAIN_PATH:-}" \
            && -f "$WRITER_AGENT_SIGNING_KEYCHAIN_PATH" ]]; then
            /usr/bin/security delete-keychain "$WRITER_AGENT_SIGNING_KEYCHAIN_PATH"
          fi

      - name: 上传平台安装包
        uses: actions/upload-artifact@v4
        with:
          name: writer-agent-${{ needs.preflight.outputs.version }}-${{ matrix.name }}
          path: |
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            source/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布公开下载 Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 检出版本更新说明
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: 下载全部平台安装包
        uses: actions/download-artifact@v4
        with:
          pattern: writer-agent-${{ needs.preflight.outputs.version }}-*
          path: release-assets

      - name: 校验并发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes_file="source/RELEASE_NOTES.md"
          bash source/scripts/check-release-notes.sh "$RELEASE_TAG" "$release_notes_file"
          mkdir -p publish-assets

          copy_unique() {
            local source="$1"
            local destination="$2"
            if [[ -e "publish-assets/$destination" ]]; then
              echo "发布文件名冲突: $destination" >&2
              exit 1
            fi
            cp "$source" "publish-assets/$destination"
          }

          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            safe_name="${name// /.}"
            copy_unique "$asset" "$safe_name"
          done < <(find release-assets -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' \
          \) -print0)

          copy_macos_update() {
            local platform_name="$1"
            local architecture="$2"
            local source_dir="release-assets/writer-agent-${{ needs.preflight.outputs.version }}-$platform_name"
            local archive
            archive="$(find "$source_dir" -type f -name '*.app.tar.gz' -print -quit)"
            if [[ -z "$archive" || ! -f "$archive.sig" ]]; then
              echo "缺少 macOS $architecture 更新包或签名" >&2
              exit 1
            fi
            local destination="Writer.Agent_${{ needs.preflight.outputs.version }}_${architecture}.app.tar.gz"
            copy_unique "$archive" "$destination"
            copy_unique "$archive.sig" "$destination.sig"
          }

          copy_macos_update macOS-ARM64 aarch64
          copy_macos_update macOS-Intel x64

          while IFS= read -r -d '' signature; do
            name="$(basename "$signature")"
            safe_name="${name// /.}"
            copy_unique "$signature" "$safe_name"
          done < <(find release-assets -type f \( \
            -name '*.AppImage.sig' -o -name '*.msi.sig' -o -name '*.exe.sig' \
          \) -print0)

          require_count() {
            local expected="$1"
            local pattern="$2"
            local actual
            actual="$(find publish-assets -maxdepth 1 -type f -name "$pattern" | wc -l | tr -d ' ')"
            if [[ "$actual" != "$expected" ]]; then
              echo "发布产物数量异常: $pattern 预期 $expected，实际 $actual" >&2
              exit 1
            fi
          }

          require_count 2 '*.dmg'
          require_count 1 '*.msi'
          require_count 1 '*.exe'
          require_count 1 '*.AppImage'
          require_count 1 '*.deb'
          require_count 2 '*.app.tar.gz'
          require_count 2 '*.app.tar.gz.sig'
          require_count 1 '*.msi.sig'
          require_count 1 '*.exe.sig'
          require_count 1 '*.AppImage.sig'

          single_asset() {
            local pattern="$1"
            find publish-assets -maxdepth 1 -type f -name "$pattern" -print -quit
          }

          release_url() {
            local asset="$1"
            printf 'https://github.com/%s/releases/download/%s/%s' \
              "$DISTRIBUTION_REPOSITORY" "$RELEASE_TAG" "$(basename "$asset")"
          }

          macos_arm_update="publish-assets/Writer.Agent_${{ needs.preflight.outputs.version }}_aarch64.app.tar.gz"
          macos_intel_update="publish-assets/Writer.Agent_${{ needs.preflight.outputs.version }}_x64.app.tar.gz"
          windows_nsis_update="$(single_asset '*.exe')"
          windows_msi_update="$(single_asset '*.msi')"
          linux_update="$(single_asset '*.AppImage')"

          jq -n \
            --arg version "${RELEASE_TAG#v}" \
            --rawfile notes "$release_notes_file" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg macos_arm_url "$(release_url "$macos_arm_update")" \
            --arg macos_arm_signature "$(tr -d '\r\n' < "$macos_arm_update.sig")" \
            --arg macos_intel_url "$(release_url "$macos_intel_update")" \
            --arg macos_intel_signature "$(tr -d '\r\n' < "$macos_intel_update.sig")" \
            --arg windows_nsis_url "$(release_url "$windows_nsis_update")" \
            --arg windows_nsis_signature "$(tr -d '\r\n' < "$windows_nsis_update.sig")" \
            --arg windows_msi_url "$(release_url "$windows_msi_update")" \
            --arg windows_msi_signature "$(tr -d '\r\n' < "$windows_msi_update.sig")" \
            --arg linux_url "$(release_url "$linux_update")" \
            --arg linux_signature "$(tr -d '\r\n' < "$linux_update.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: $macos_arm_url,
                  signature: $macos_arm_signature
                },
                "darwin-x86_64": {
                  url: $macos_intel_url,
                  signature: $macos_intel_signature
                },
                "windows-x86_64": {
                  url: $windows_nsis_url,
                  signature: $windows_nsis_signature
                },
                "windows-x86_64-nsis": {
                  url: $windows_nsis_url,
                  signature: $windows_nsis_signature
                },
                "windows-x86_64-msi": {
                  url: $windows_msi_url,
                  signature: $windows_msi_signature
                },
                "linux-x86_64": {
                  url: $linux_url,
                  signature: $linux_signature
                },
                "linux-x86_64-appimage": {
                  url: $linux_url,
                  signature: $linux_signature
                }
              }
            }' > publish-assets/latest.json

          (
            cd publish-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          mapfile -d '' assets < <(find publish-assets -maxdepth 1 -type f -print0)
          if [[ "${#assets[@]}" != "15" ]]; then
            echo "发布资产数量异常: ${#assets[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$DISTRIBUTION_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "公开 Release 已发布，拒绝覆盖: $RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$DISTRIBUTION_REPOSITORY" \
              --title "Writer Agent $RELEASE_TAG" \
              --notes-file "$release_notes_file" \
              --draft
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$DISTRIBUTION_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$DISTRIBUTION_REPOSITORY" \
            --notes-file "$release_notes_file" \
            --draft=false
